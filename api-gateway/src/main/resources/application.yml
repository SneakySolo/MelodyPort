spring:
  application:
    name: api-gateway
  cloud:
    compatibility-verifier:
      enabled: false

  security:
    oauth2:
      client:
        # OAuth2 registration handled by auth-service (8081)
        # Gateway only validates session tokens via auth-service
        enabled: false

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}

server:
  port: 8080

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: TRACE
    com.melodyport: DEBUG