version: '3.8'

services:
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: melodyport-kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    networks:
      - melodyport-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: melodyport-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - melodyport-network

  redis:
    image: redis:7-alpine
    container_name: melodyport-redis
    ports:
      - "6379:6379"
    networks:
      - melodyport-network

networks:
  melodyport-network:
    driver: bridge