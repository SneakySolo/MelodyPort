spring:
  application:
    name: auth-service
  cloud:
    compatibility-verifier:
      enabled: false

  security:
    oauth2:
      client:
        # Disable Spring's auto OAuth2 configuration
        # We handle OAuth manually in SpotifyOAuth2Service and SpotifyAuthController
        enabled: false

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}

server:
  port: 8081

logging:
  level:
    com.melodyport: DEBUG
    org.springframework.web: INFO
    org.springframework.security.oauth2: DEBUG
    org.springframework.web.client: DEBUG